<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Homepage</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <header class="site-header">
      <div class="logo">Brand</div>

      <button
        class="nav-toggle"
        aria-label="Toggle navigation"
        aria-expanded="false"
        aria-controls="primary-nav"
      >
        <span class="hamburger"></span>
      </button>

      <nav id="primary-nav" class="primary-nav">
        <ul class="nav-list">
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Services</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="hero">

        <div class="about-me-container">
          <div class="profile-image-container">
            <h1 class="profile-name">Chip</h1>
            <img class="profile-image" alt="chip the puppy" src="https://images.pexels.com/photos/14264901/pexels-photo-14264901.jpeg">
          </div>
          <h2>About me</h2>
          <p>I'm a dog and I like treats</p>
        </div>

      </section>

      <section>

      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 Brand. All rights reserved.</p>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
